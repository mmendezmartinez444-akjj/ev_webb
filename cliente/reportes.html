<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <title>Reportes · El Pistón</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <script src="js/tema.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/paginas/reportes.js"></script>
</head>
<body>
  <header id="cabecera"></header>
  <main class="pagina" id="principal">
    <section class="titular">
      <div>
        <h1>Reportes</h1>
        <p id="periodo-texto">Facturación, deudas y carga del equipo</p>
      </div>
      <button type="button" class="boton boton--sobrio no-imprimir" id="boton-imprimir"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12v5H6zm-2 7h16a2 2 0 0 1 2 2v6h-4v4H6v-4H2v-6a2 2 0 0 1 2-2m4 7v3h8v-3z"/></svg>Imprimir</button>
    </section>
    <div class="herramientas no-imprimir">
      <div class="segmentos" id="periodo" role="group" aria-label="Período">
        <button type="button" class="segmento" data-valor="hoy" aria-pressed="false">Hoy</button>
        <button type="button" class="segmento" data-valor="semana" aria-pressed="false">7 días</button>
        <button type="button" class="segmento" data-valor="mes" aria-pressed="true">Este mes</button>
        <button type="button" class="segmento" data-valor="anterior" aria-pressed="false">Mes anterior</button>
        <button type="button" class="segmento" data-valor="otro" aria-pressed="false">Otro</button>
      </div>
      <form id="rango" class="herramientas sin-margen oculto" novalidate>
        <input type="date" class="entrada ancho-auto" name="desde" required aria-label="Desde">
        <input type="date" class="entrada ancho-auto" name="hasta" required aria-label="Hasta">
        <button type="submit" class="boton boton--chico">Aplicar</button>
      </form>
    </div>
    <section class="cifras" id="cifras-periodo"></section>
    <section class="bloque">
      <div class="bloque__titulo">
        <h2>Facturado y cobrado por día</h2>
        <div class="leyenda-grafico"><span class="serie--facturado">Facturado</span><span class="serie--cobrado">Cobrado</span></div>
      </div>
      <div id="grafico"></div>
    </section>
    <div class="columnas columnas--dos separado">
      <section class="bloque">
        <div class="bloque__titulo"><h2>Quién debe</h2><span class="etiqueta" id="total-deuda"></span></div>
        <div id="saldos"></div>
      </section>
      <section class="bloque">
        <div class="bloque__titulo"><h2>Carga del equipo</h2></div>
        <div id="carga"></div>
      </section>
    </div>
    <section class="bloque">
      <div class="bloque__titulo"><h2>Órdenes entregadas en el período</h2></div>
      <div id="entregadas"></div>
    </section>
  </main>
  <nav id="barra-movil"></nav>
  <div class="avisos" id="avisos" aria-live="polite"></div>
</body>
</html>
