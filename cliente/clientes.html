<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <title>Clientes · El Pistón</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <script src="js/tema.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/paginas/clientes.js"></script>
</head>
<body>
  <header id="cabecera"></header>
  <main class="pagina" id="principal">
    <div class="dividido" id="dividido">
      <section class="bloque lista-panel">
        <div class="bloque__titulo">
          <h1>Clientes</h1>
          <button type="button" class="boton boton--chico" id="boton-nuevo-cliente">Nuevo</button>
        </div>
        <label class="campo-busqueda">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3m0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10"/></svg>
          <input type="search" id="buscar-cliente" placeholder="Nombre o teléfono" aria-label="Buscar clientes">
        </label>
        <p class="etiqueta margen-etiqueta" id="total-clientes"></p>
        <div class="lista-maestra" id="lista-clientes"></div>
      </section>
      <section class="detalle-panel" id="detalle-cliente"></section>
    </div>
  </main>
  <nav id="barra-movil"></nav>
  <div id="hojas-clientes"></div>
  <div class="avisos" id="avisos" aria-live="polite"></div>
</body>
</html>
