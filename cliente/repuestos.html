<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <title>Repuestos · El Pistón</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <script src="js/tema.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/paginas/repuestos.js"></script>
</head>
<body>
  <header id="cabecera"></header>
  <main class="pagina" id="principal">
    <section class="titular">
      <div>
        <h1>Repuestos</h1>
        <p id="resumen-inventario">Cargando inventario…</p>
      </div>
      <button type="button" class="boton oculto" id="boton-nuevo-repuesto">Nuevo repuesto</button>
    </section>
    <div class="herramientas">
      <label class="campo-busqueda">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3m0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10"/></svg>
        <input type="search" id="buscar-repuesto" placeholder="Nombre o código" aria-label="Buscar repuestos">
      </label>
      <div class="segmentos" id="vista-repuestos" role="group" aria-label="Filtro de existencias">
        <button type="button" class="segmento" data-valor="todos" aria-pressed="true">Todos</button>
        <button type="button" class="segmento" data-valor="bajos" aria-pressed="false">Por agotarse</button>
        <button type="button" class="segmento" data-valor="agotados" aria-pressed="false">Agotados</button>
      </div>
      <select class="entrada ancho-auto" id="orden-repuestos" aria-label="Ordenar">
        <option value="nombre">Nombre</option>
        <option value="existencias">Menos existencias</option>
        <option value="-precio">Mayor precio</option>
      </select>
    </div>
    <div class="rejilla-repuestos" id="rejilla-repuestos"></div>
  </main>
  <nav id="barra-movil"></nav>
  <div id="hojas-repuestos"></div>
  <div class="avisos" id="avisos" aria-live="polite"></div>
</body>
</html>
